<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Пользователи</title>
</head>
<body>
    <div class="container">
        <h1>Список пользователей</h1>
        {% if users %}
            <table>
                <thead>
                    <tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Роль</th></tr>
                </thead>
                <tbody>
                    {% for u in users %}
                    <tr>
                        <td>{{ u.id }}</td>
                        <td>{{ u.name }}</td>
                        <td>{{ u.phone }}</td>
                        <td>{{ u.role }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>Пользователи не найдены.</p>
        {% endif %}
        <a href="{{ url_for('index') }}" class="btn">← На главную</a>
    </div>
</body>
</html>
